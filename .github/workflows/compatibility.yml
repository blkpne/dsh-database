name: DSH compatibility

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci
      - name: Verify one tarball against minimum and latest DSH
        run: npm run test:compat
        env:
          DSH_DATABASE_TEST_ROOT: test-results/compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-compatibility
          path: test-results/compatibility/release/
          retention-days: 14
